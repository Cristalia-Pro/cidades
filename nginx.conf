events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Set CORS headers for all responses in this server block
        # Allows requests from any origin. For production, replace '*' with your Angular app's domain (e.g., 'http://localhost:4200' or 'https://your-angular-app.com')
        add_header 'Access-Control-Allow-Origin' '*';
        # Specifies which HTTP methods are allowed when accessing the resource.
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        # Specifies which headers can be used when making the actual request.
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        # Defines how long the results of a preflight request can be cached.
        add_header 'Access-Control-Max-Age' 1728000;
        # Allows credentials (cookies, HTTP authentication) to be sent with the request.
        add_header 'Access-Control-Allow-Credentials' 'true';

        # Handle preflight OPTIONS requests
        # Browsers send an OPTIONS request before the actual request for complex cross-origin requests.
        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            # Serve static files from /usr/share/nginx/html
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        # Specific location for your JSON API endpoint
        location /api/cidades {
            # Ensure the correct content type for JSON
            default_type application/json;
            # Serve the data.json file
            alias /usr/share/nginx/html/data.json;
        }
    }
}