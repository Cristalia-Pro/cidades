map $http_origin $cors_origin {
    default "";
    "~*http://localhost:4200" "http://localhost:4200";
    "~*https://cristaliapro.com.br" "https://cristaliapro.com.br";
}

server {
    listen 80;
    server_name localhost;

    # Set CORS headers for all responses in this server block.
    # The 'always' keyword ensures the headers are included even for error responses.
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header 'Access-Control-Max-Age' 1728000;
    add_header 'Access-Control-Allow-Credentials' 'true';

    # Handle preflight OPTIONS requests by returning a 204 status with no content.
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Location to serve your JSON API endpoint.
    location /api/cidades {
        default_type application/json;
        alias /usr/share/nginx/html/data.json;
    }
}